# XcodeGen project definition. CI runs `xcodegen generate`; the .xcodeproj is never committed.
#
# Everything personal is injected by CI on the xcodebuild command line (ci/archive.sh), so the values below are
# harmless placeholders:
#   PRODUCT_BUNDLE_IDENTIFIER  <- secret DEALDESK_BUNDLE_ID
#   DEVELOPMENT_TEAM           <- variable TEAM_ID
#   DD_BASE_URL / DD_APP_TOKEN <- secrets DEALDESK_BASE_URL / DEALDESK_APP_TOKEN (Info.plist DDBaseURL / DDAppToken)
#   MARKETING_VERSION          <- release-please only (marker below); CI checks it equals the release tag
#   CURRENT_PROJECT_VERSION    <- TestFlight run number, raised above any build App Store Connect has (ci/asc_setup.py)
name: DealDesk
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  DealDesk:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_NAME: DealDesk
        PRODUCT_BUNDLE_IDENTIFIER: com.REPLACE.dealdesk   # placeholder; CI overrides from secret DEALDESK_BUNDLE_ID
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/DealDesk.entitlements
        MARKETING_VERSION: "1.5.2"                       # x-release-please-version
        CURRENT_PROJECT_VERSION: "1"                     # CI overrides
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"                      # iPhone
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: "YES"
        DD_BASE_URL: "https://REPLACE.invalid"           # placeholder; the app shows "Not set up" until set
        DD_APP_TOKEN: "REPLACE_APP_TOKEN"                # placeholder
  DealDeskTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: DealDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.REPLACE.dealdesk.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DealDesk.app/DealDesk"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DealDesk:
    build:
      targets:
        DealDesk: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DealDeskTests
    archive:
      config: Release
