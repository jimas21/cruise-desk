name: TestFlight
run-name: Deal Desk ${{ github.ref_name }}

# Builds the app and uploads it to TestFlight with this repository's own App Store Connect key, so nothing here
# depends on any other project. The Release workflow starts it on each new vX.Y.Z tag (gh workflow run --ref vX.Y.Z);
# it can also be started by hand from the Actions tab: pick the latest vX.Y.Z tag to rebuild a release, or main for
# a labelled manual build. Settings > Secrets and variables > Actions:
#   variable TEAM_ID
#   secrets  ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   (an App Store Connect API key made for Deal Desk)
#   secrets  DEALDESK_BUNDLE_ID, DEALDESK_BASE_URL, DEALDESK_APP_TOKEN
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealdesk-testflight
  cancel-in-progress: false

jobs:
  build:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 40
    env:
      BUNDLE_ID: ${{ secrets.DEALDESK_BUNDLE_ID }}
      TEAM_ID: ${{ vars.TEAM_ID }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out Deal Desk
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Preflight (settings present and well-formed)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DD_BASE_URL: ${{ secrets.DEALDESK_BASE_URL }}
          DD_APP_TOKEN: ${{ secrets.DEALDESK_APP_TOKEN }}
        run: bash ci/preflight.sh

      # A build from a vX.Y.Z tag must carry exactly that version (release-please writes it into project.yml in the
      # release commit the tag points at). Any other ref is a manual build and is labelled as one.
      - name: Check the version against the tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Tag $REF_NAME is not a release tag (vX.Y.Z)."; exit 1; }
            [ "${REF_NAME#v}" = "$MARKETING_VERSION" ] || { echo "::error::Tag $REF_NAME but project.yml says $MARKETING_VERSION. Never edit MARKETING_VERSION by hand; re-run from the latest release tag."; exit 1; }
            echo "BUILD_KIND=release $REF_NAME" >> "$GITHUB_ENV"
          else
            echo "::warning::Manual build of $REF_NAME ($MARKETING_VERSION), not a release. Rebuild a release from its vX.Y.Z tag."
            echo "BUILD_KIND=manual build of $REF_NAME" >> "$GITHUB_ENV"
          fi

      - name: Write API key to a temp file
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bash ci/write_key.sh

      - name: Python tools (icon, Apple setup)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow "pyjwt[crypto]"

      # Registers the bundle ID, turns on Push Notifications for it, checks the App Store Connect app exists,
      # picks the build number and sets up the internal TestFlight group. Stops with instructions if the app
      # record is missing.
      - name: Apple setup
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: '"$RUNNER_TEMP/venv/bin/python" ci/asc_setup.py'

      - name: Make app icon
        run: '"$RUNNER_TEMP/venv/bin/python" ci/make_icon.py App/Assets.xcassets/AppIcon.appiconset/AppIcon.png'

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen || { brew update && brew install xcodegen; }

      - name: Generate project and archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DD_BASE_URL: ${{ secrets.DEALDESK_BASE_URL }}
          DD_APP_TOKEN: ${{ secrets.DEALDESK_APP_TOKEN }}
        run: bash ci/archive.sh

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash ci/export_upload.sh

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deal Desk uploaded to TestFlight"
            echo ""
            echo "- Version: \`${MARKETING_VERSION} (${BUILD_NUMBER})\` (${BUILD_KIND})"
            echo "- cruise-desk: \`$(git rev-parse --short HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key file
        if: always()
        run: bash ci/cleanup.sh
