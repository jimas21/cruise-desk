name: Compile check

# Compiles the app for the iOS Simulator, unsigned, on every push, then runs the unit tests on a simulator,
# so Swift mistakes and logic slips show up in minutes.
# No secrets: the server address and token stay the placeholders from project.yml.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Make app icon
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/venv/bin/python" ci/make_icon.py App/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Install XcodeGen
        run: brew install xcodegen || { brew update && brew install xcodegen; }

      - name: Show toolchain
        run: xcodebuild -version

      - name: Compile for the simulator (unsigned)
        run: |
          xcodegen generate
          status=0
          xcodebuild -project DealDesk.xcodeproj -scheme DealDesk -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || status=$?
          echo "--- errors and warnings in our code ---"
          grep -E '/App/.*: (error|warning): ' build.log | sed -E 's#^.*/App/#App/#' | sort -u | head -n 200 || true
          if [ "$status" -ne 0 ] || ! grep -q 'BUILD SUCCEEDED' build.log; then
            echo "--- context ---"
            grep -E -B2 -A6 ' error: ' build.log | head -n 400 || true
            echo "--- last lines ---"
            tail -n 30 build.log
            echo "::error::Build failed"
            exit 1
          fi
          echo "BUILD SUCCEEDED ($(grep -cE '^SwiftCompile ' build.log || true) Swift compile steps)"

      - name: Unit tests (simulator)
        env:
          # SnapshotTests renders every screen (sample data, light and dark) into this folder.
          TEST_RUNNER_SNAPSHOT_DIR: ${{ github.workspace }}/snapshots
        run: |
          udid="$(xcrun simctl list devices available -j | python3 ci/pick_simulator.py)"
          status=0
          xcodebuild test -project DealDesk.xcodeproj -scheme DealDesk -destination "id=$udid" CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || status=$?
          grep -E "Test Case .*(passed|failed)|Executed [0-9]+ test|: error:|TEST (SUCCEEDED|FAILED)" test.log | head -n 200 || true
          if [ "$status" -ne 0 ] || ! grep -q 'TEST SUCCEEDED' test.log; then
            echo "--- last lines ---"
            tail -n 60 test.log
            echo "::error::Tests failed"
            exit 1
          fi
          ls snapshots 2>/dev/null | sed 's/^/screenshot: /' || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: snapshots/
          if-no-files-found: warn
          retention-days: 14
