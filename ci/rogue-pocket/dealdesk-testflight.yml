name: Deal Desk TestFlight
run-name: Deal Desk ${{ inputs.ref }}

# Builds the Deal Desk iPhone app from jimas21/cruise-desk and uploads it to TestFlight. It lives in rogue-pocket
# because this repository holds the team's App Store Connect key (GitHub secrets can't be shared between
# repositories). Nothing from Rogue Pocket is built or changed; only cruise-desk is checked out.
#
# Copy this file to rogue-pocket/.github/workflows/ and set, under Settings > Secrets and variables > Actions:
#   variable TEAM_ID                 (already there for Rogue Pocket)
#   secrets  ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   (already there)
#   secret   DEALDESK_BUNDLE_ID      your bundle ID (a secret so public logs show it masked)
#   secret   DEALDESK_BASE_URL       https address of dealdesk-api
#   secret   DEALDESK_APP_TOKEN      the app-role token (same value as the NAS's app_token file)
#   secret   DEALDESK_DEPLOY_KEY     only while cruise-desk is private: the private half of a READ-ONLY deploy key
#                                    added to cruise-desk (Settings > Deploy keys). Not needed if cruise-desk is public.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: cruise-desk branch, tag or commit to build
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: dealdesk-testflight
  cancel-in-progress: false

jobs:
  build:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 40
    env:
      BUNDLE_ID: ${{ secrets.DEALDESK_BUNDLE_ID }}
      TEAM_ID: ${{ vars.TEAM_ID }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out Deal Desk
        uses: actions/checkout@v5
        with:
          repository: jimas21/cruise-desk
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.DEALDESK_DEPLOY_KEY }}
          persist-credentials: false

      - name: Preflight (settings present and well-formed)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DD_BASE_URL: ${{ secrets.DEALDESK_BASE_URL }}
          DD_APP_TOKEN: ${{ secrets.DEALDESK_APP_TOKEN }}
        run: bash ci/preflight.sh

      - name: Write API key to a temp file
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bash ci/write_key.sh

      - name: Python tools (icon, Apple setup)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow "pyjwt[crypto]"

      # Registers the bundle ID, turns on Push Notifications for it, checks the App Store Connect app exists,
      # picks the build number and sets up the internal TestFlight group. Stops with instructions if the app
      # record is missing.
      - name: Apple setup
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: '"$RUNNER_TEMP/venv/bin/python" ci/asc_setup.py'

      - name: Make app icon
        run: '"$RUNNER_TEMP/venv/bin/python" ci/make_icon.py App/Assets.xcassets/AppIcon.appiconset/AppIcon.png'

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen || { brew update && brew install xcodegen; }

      - name: Generate project and archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DD_BASE_URL: ${{ secrets.DEALDESK_BASE_URL }}
          DD_APP_TOKEN: ${{ secrets.DEALDESK_APP_TOKEN }}
        run: bash ci/archive.sh

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash ci/export_upload.sh

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deal Desk uploaded to TestFlight"
            echo ""
            echo "- Version: \`${MARKETING_VERSION} (${BUILD_NUMBER})\`"
            echo "- cruise-desk: \`$(git rev-parse --short HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key file
        if: always()
        run: bash ci/cleanup.sh
